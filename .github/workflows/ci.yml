# CI frontend CMSVN: lint + build (tsc -b + vite) + build image nginx (KHONG push).
name: frontend-ci
on:
  pull_request:
  push:
    branches: [main, feature/ui-updates-2026-10]
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cmsvn-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
