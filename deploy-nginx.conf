server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 16m;   # khop Kestrel MaxRequestBodySize

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
  }
  # SignalR (WebSocket)
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
  }
  location = /index.html { add_header Cache-Control "no-cache, no-store"; }
  location = /sw.js { add_header Cache-Control "no-cache, no-store"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache, no-store"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
